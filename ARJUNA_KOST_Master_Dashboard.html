function metric(icon,title,value,foot,tone=''){return `<div class="card metric"><div class="metric-top"><span class="metric-title">${title}</span><div class="metric-icon ${tone}">${I(icon,18)}</div></div><div class="metric-value">${value}</div><div class="metric-foot">${foot}</div></div>`}
function summary(){let arr=buildingRooms(),st=roomsStats(arr);return `<div class="grid four">${metric('building','Okupansi Kamar',`${Math.round(st.occupied/st.total*100||0)}%`,`<strong>${st.occupied}</strong> terisi dari ${st.total} kamar`)}${metric('wallet','Pendapatan Sewa',compact(st.collected),`Dari ${compact(st.billed)} tagihan berjalan`,'gold')}${metric('alert','Tagihan Tertunda',compact(st.billed-st.collected),`${st.due} kamar menunggu pembayaran`,'amber')}${metric('shield','Tiket Aktif',`${activeTickets().length}`,`${activeOrders().length} pesanan layanan masih berjalan`,'red')}</div>`}
function buildingCard(b){const s=roomsStats(selectedRooms(b));const roomTicket=state.tickets.filter(t=>t.room.startsWith(b+'-')&&t.status!=='done').length;return `<div class="card building-card"><div class="building-header"><div class="b-icon">${I('building',23)}</div><div><div class="b-title">Gedung ${b}</div><div class="subtle">Operasional aktif</div></div><div class="push"><span class="badge green">Aktif</span></div></div><div class="b-metric"><div><span class="large">${s.occupied}<span style="font-size:14px;color:#8ca199;font-weight:550"> / ${s.total}</span></span><div><small>Kamar terisi</small></div></div><div style="text-align:right"><span class="large" style="font-size:22px">${Math.round(s.occupied/s.total*100)}%</span><div><small>Occupancy</small></div></div></div><div class="bar"><i style="width:${s.occupied/s.total*100}%"></i></div><div class="building-foot"><span class="bf-meta"><i class="stat-dot" style="background:#c59147"></i>${s.due} tunggakan &nbsp;·&nbsp; ${roomTicket} tiket</span><button class="link" onclick="app.building('${b}');app.go('rooms')">Lihat kamar ${I('chevron',13)}</button></div></div>`}
function matrix(arr,large=false){return `<div class="${large?'room-card-grid':'rooms-grid'}">${arr.map(r=>`<button title="${esc(r.id)} · ${r.tenant?esc(r.tenant):'Kamar tersedia'}" class="room-cell ${r.status}" onclick="app.room('${r.id}')"><span class="room-id">${r.id}</span>${large?`<span class="room-tiny">${r.status==='vacant'?'Kosong':r.status==='due'?'Menunggak':'Lunas'}</span>`:''}</button>`).join('')}</div>`}
function sectionTitle(title,sub,action=''){return `<div class="section-title"><div><h2>${title}</h2>${sub?`<small>${sub}</small>`:''}</div>${action}</div>`}
function orderRow(o){let p=state.partners.find(p=>p.id===o.partner);return `<div class="list-row"><div class="small-icon">${I(p?.icon||'bag',18)}</div><div class="row-main"><div class="row-title">${esc(o.service)}</div><div class="row-sub">${esc(o.room)} · ${esc(p?.name||'Mitra')} · ${esc(o.time)}</div></div><div class="row-end"><span class="amount">${currency(o.amount)}</span>${badge(o.status)}</div><button class="icon-btn" title="Detail pesanan" onclick="app.order('${o.id}')">${I('chevron',14)}</button></div>`}
function ticketRow(t){return `<div class="list-row"><div class="small-icon ${t.priority==='critical'?'red':t.priority==='high'?'amber':''}">${I(t.priority==='critical'?'alert':'wrench',18)}</div><div class="row-main"><div class="row-title">${esc(t.issue)}</div><div class="row-sub">${esc(t.room)} · ${esc(t.owner)} · SLA ${esc(t.sla)}</div></div><div class="row-end">${badge(t.priority)}<span class="subtle">${esc(t.time)}</span></div><button class="icon-btn" title="Lihat tiket" onclick="app.ticket('${t.id}')">${I('chevron',14)}</button></div>`}
function revenueChart(){const rooms=buildingRooms();const st=roomsStats(rooms),mult=ui.building==='all'?1:.5;const capacity=st.total*1000000;const months=[['Mei',.75,.73],['Jun',.83,.8],['Jul',.87,.83],['Agu',.85,.8],['Sep',.89,.84],['Okt',st.billed/capacity,st.collected/capacity]]; const height=175;return `<div class="chart-wrap"><div class="chart-base"></div>${months.map(([m,b,c])=>`<div class="chart-barset"><div class="chart-bar billed" title="Tagihan ${m}: ${compact(Math.round(b*30e6*mult))}" style="height:${Math.max(6,b*100)}%"></div><div class="chart-bar paid" title="Dibayar ${m}: ${compact(Math.round(c*30e6*mult))}" style="height:${Math.max(6,c*100)}%"></div><span class="chart-label">${m}</span></div>`).join('')}</div><div class="legend mt14"><span><i style="background:#d9e8df"></i>Tagihan</span><span><i style="background:#26765e"></i>Terbayar</span><span style="margin-left:auto">Riwayat Mei–Sep adalah ilustrasi</span></div>`}
function overview(){let arr=buildingRooms(),st=roomsStats(arr),blds=ui.building==='all'?['A','B']:[ui.building];return `${pageHeader('OPERASIONAL / OVERVIEW','Satu dashboard, semua terkendali.',`Ringkasan gedung, penghuni, layanan, dan tanggung jawab. ${esc(dateNow())}.`,`<button class="btn" onclick="app.export()">${I('download',15)} Export laporan</button><button class="btn primary" onclick="app.newTicket()">${I('add',16)} Buat tiket</button>`)}<div class="top-note">${I('info',17)} Mode prototipe: semua nama, transaksi, status, mitra, dan biaya adalah contoh. Perubahan hanya tersimpan di browser ini.</div>${summary()}<div class="grid two section-gap">${blds.map(buildingCard).join('')}</div><div class="grid lower section-gap"><div class="card padded">${sectionTitle('Peta 30 Kamar','Klik nomor kamar untuk melihat penghuni, pembayaran, dan tindakan.',`<button class="link" onclick="app.go('rooms')">Kelola kamar ${I('right',13)}</button>`)}${matrix(arr)}<div class="divider"></div><div class="legend"><span><i style="background:#3f9b76"></i>Lunas</span><span><i style="background:#d8a64c"></i>Menunggak</span><span><i style="background:#d8ddda"></i>Kosong</span></div></div><div class="card padded">${sectionTitle('Pendapatan Sewa','Tampilan ilustratif selama enam bulan.',`<button class="link" onclick="app.go('finance')">Laporan ${I('right',13)}</button>`)}${revenueChart()}</div></div><div class="grid lower section-gap"><div class="card padded">${sectionTitle('Pesanan Marketplace',`${activeOrders().length} pesanan memerlukan proses.`,`<button class="link" onclick="app.go('market')">Semua pesanan ${I('right',13)}</button>`)}<div class="list">${orderGroup().filter(o=>o.status!=='done').slice(0,4).map(orderRow).join('')||empty('Tidak ada pesanan aktif','Seluruh pesanan layanan telah selesai.')}</div></div><div class="card padded">${sectionTitle('Service Assurance',`${activeTickets().length} tiket belum selesai.`,`<button class="link" onclick="app.go('tickets')">Kelola tiket ${I('right',13)}</button>`)}<div class="list">${ticketGroup().filter(t=>t.status!=='done').slice(0,4).map(ticketRow).join('')||empty('Tidak ada tiket aktif','Semua masalah telah ditangani.')}</div></div></div><div class="section-gap">${roadmap()}</div>`}
function roadmap(){return `<div class="ghost-roadmap"><div class="b-icon" style="background:#f0f2ed">${I('building',23)}</div><div style="flex:1"><strong>Fondasi ekspansi sudah direncanakan untuk 2027</strong><p>Gedung C belum aktif. Ketika siap, sistem dapat menambah gedung, lantai, kamar, penghuni, dan laporan per gedung tanpa mengganti website.</p></div><button class="btn sm" onclick="app.go('settings')">Lihat rencana ${I('chevron',13)}</button></div>`}
function empty(title,sub){return `<div class="empty">${I('package',25)}<strong>${title}</strong>${sub}</div>`}
function roomsPage(){let arr=buildingRooms().filter(r=>ui.roomFilter==='all'||r.status===ui.roomFilter);let st=roomsStats(buildingRooms());return `${pageHeader('PROPERTY MANAGEMENT','Kamar & Gedung','Kelola seluruh kamar dalam dua gedung yang saling berhadapan.',`<button class="btn primary" onclick="app.newTicket()">${I('add',16)} Tiket perbaikan</button>`)}<div class="grid four">${metric('door','Total kamar',st.total,'Kapasitas pada filter saat ini')}${metric('users','Terisi',st.occupied,'Kontrak aktif')}${metric('clock','Menunggak',st.due,'Perlu penagihan','amber')}${metric('home','Tersedia',st.vacant,'Belum ditempati')}</div><div class="card padded section-gap">${sectionTitle('Peta status kamar','Pilih status untuk menyaring daftar. Klik kamar untuk detail dan tindakan.')}<div class="filters">${[['all','Semua'],['paid','Lunas'],['due','Menunggak'],['vacant','Kosong']].map(([k,n])=>`<button class="filter-chip ${ui.roomFilter===k?'active':''}" onclick="app.roomFilter('${k}')">${n}</button>`).join('')}</div>${matrix(arr,true)}${arr.length?'':empty('Tidak ada kamar','Tidak ada kamar yang cocok dengan status ini.')}</div><div class="grid two section-gap">${['A','B'].map(buildingCard).join('')}</div>`}
function residentsPage(){let arr=buildingRooms().filter(r=>r.status!=='vacant');return `${pageHeader('RESIDENT DATABASE','Penghuni ARJUNA','Satu penghuni terhubung ke satu kamar dan kontrak. Data pribadi ditampilkan hanya kepada pengguna berwenang.')}<div class="card padded"><div class="row-split mb10"><strong>Daftar penghuni</strong><span class="chip-num">${arr.length} penghuni aktif</span></div><div class="table-wrap"><table><thead><tr><th>Penghuni</th><th>Kamar</th><th>Gedung</th><th>Sewa / bulan</th><th>Status pembayaran</th><th>Detail</th></tr></thead><tbody>${arr.map(r=>`<tr class="tr-click" onclick="app.room('${r.id}')"><td><strong>${esc(r.tenant)}</strong></td><td>${esc(r.id)}</td><td>Gedung ${r.building}</td><td>${currency(r.rent)}</td><td>${badge(r.status)}</td><td><button class="link">Lihat ${I('chevron',12)}</button></td></tr>`).join('')}</tbody></table></div></div>`}
function marketPage(){let data=orderGroup().filter(o=>ui.orderFilter==='all'||o.status===ui.orderFilter);return `${pageHeader('ARJUNA MARKET','Marketplace & Pesanan','Seluruh order dari toko dan mitra layanan masuk ke satu pusat pemantauan.',`<button class="btn primary" onclick="app.newOrder()">${I('add',16)} Simulasi pesanan</button>`)}<div class="grid four">${metric('bag','Total pesanan',orderGroup().length,'Pesanan pada data demonstrasi')}${metric('clock','Menunggu mitra',orderGroup().filter(o=>o.status==='new').length,'Perlu konfirmasi','amber')}${metric('package','Dalam proses',orderGroup().filter(o=>o.status==='process').length,'Sedang dikerjakan')}${metric('wallet','Nilai transaksi',compact(orderGroup().reduce((a,o)=>a+o.amount,0)),'Bukan pendapatan komisi ARJUNA','gold')}</div><div class="card padded section-gap">${sectionTitle('Pesanan seluruh mitra','Klik pesanan untuk mengubah status dan memantau tanggung jawab.')}<div class="filters">${[['all','Semua'],['new','Pesanan Baru'],['process','Diproses'],['done','Selesai'],['cancel','Dibatalkan']].map(([k,n])=>`<button class="filter-chip ${ui.orderFilter===k?'active':''}" onclick="app.orderFilter('${k}')">${n}</button>`).join('')}</div><div class="list">${data.map(orderRow).join('')||empty('Belum ada pesanan','Pesanan dari mitra akan muncul di sini.')}</div></div><div class="card padded section-gap">${sectionTitle('Toko & Mitra Aktif','Produk, stok, dan kinerja setiap mitra terkoneksi.')}${partnerCards(true)}</div>`}
function ticketPage(){let data=ticketGroup().filter(t=>ui.ticketFilter==='all'||t.status===ui.ticketFilter);return `${pageHeader('ARJUNA SERVICE ASSURANCE','Masalah harus punya penanggung jawab.','Setiap pengaduan memiliki lokasi, prioritas, penanggung jawab, target respons, dan jejak penanganan.',`<button class="btn primary" onclick="app.newTicket()">${I('add',16)} Buat tiket</button>`)}<div class="grid four">${metric('shield','Total laporan',ticketGroup().length,'Riwayat tiket simulasi')}${metric('alert','Darurat aktif',activeTickets().filter(t=>t.priority==='critical').length,'Butuh tindakan segera','red')}${metric('clock','Sedang ditangani',activeTickets().filter(t=>t.status==='progress').length,'Ada petugas penanggung jawab','amber')}${metric('check','Selesai',ticketGroup().filter(t=>t.status==='done').length,'Tuntas tercatat')}</div><div class="card padded section-gap">${sectionTitle('Pusat Resolusi','Penghuni cukup melapor ke ARJUNA; sistem dan pengelola mengoordinasikan penyelesaian.')}<div class="filters">${[['all','Semua'],['open','Menunggu'],['progress','Ditangani'],['done','Selesai']].map(([k,n])=>`<button class="filter-chip ${ui.ticketFilter===k?'active':''}" onclick="app.ticketFilter('${k}')">${n}</button>`).join('')}</div><div class="list">${data.map(ticketRow).join('')||empty('Tidak ada tiket','Belum ada tiket dengan status tersebut.')}</div></div><div class="grid two section-gap"><div class="note">${I('shield',16)} <strong>Prinsip satu pintu:</strong> penghuni tidak dipaksa menentukan siapa yang salah. Admin ARJUNA menjadi koordinator semua pengaduan.</div><div class="note amber">${I('alert',16)} <strong>Prioritas darurat:</strong> bahaya listrik, kebocoran besar, dan masalah keselamatan harus segera direspons melalui prosedur darurat, bukan hanya antrean biasa.</div></div>`}
function financePage(){let arr=buildingRooms(),s=roomsStats(arr);let bill=arr.filter(r=>r.status!=='vacant');return `${pageHeader('FINANCIAL CONTROL','Keuangan & Tagihan','Pisahkan pembayaran sewa, nilai transaksi marketplace, dan hak komisi mitra.',`<button class="btn" onclick="app.export()">${I('download',15)} Export CSV</button>`)}<div class="grid four">${metric('wallet','Tagihan berjalan',compact(s.billed),`${s.occupied} kamar kontrak aktif`)}${metric('check','Sewa terbayar',compact(s.collected),`${s.paid} kamar sudah lunas`)}${metric('clock','Piutang sewa',compact(s.billed-s.collected),`${s.due} kamar belum lunas`,'amber')}${metric('bag','Nilai order jasa',compact(orderGroup().reduce((a,o)=>a+o.amount,0)),'GMV, bukan pendapatan bersih','gold')}</div><div class="grid lower section-gap"><div class="card padded">${sectionTitle('Tren Pendapatan','Bulan terakhir dihitung dari simulasi status kamar.')}${revenueChart()}</div><div class="card padded">${sectionTitle('Rekonsiliasi Oktober','Ringkasan penagihan sewa kamar.')}<dl style="margin:0"><div class="detail-line"><dt>Kamar kontrak aktif</dt><dd>${s.occupied} kamar</dd></div><div class="detail-line"><dt>Total tagihan sewa</dt><dd>${currency(s.billed)}</dd></div><div class="detail-line"><dt>Sudah terbayar</dt><dd style="color:#27785a">${currency(s.collected)}</dd></div><div class="detail-line"><dt>Belum terbayar</dt><dd style="color:#b88638">${currency(s.billed-s.collected)}</dd></div><div class="detail-line"><dt>Tingkat kolektibilitas</dt><dd>${Math.round((s.collected/(s.billed||1))*100)}%</dd></div></dl><div class="note amber mt20">Belum termasuk biaya listrik, air, internet, staf, pajak, deposit, dan biaya transaksi. Laporan ini tidak boleh digunakan sebagai laba bersih.</div></div></div><div class="card padded section-gap">${sectionTitle('Daftar Tagihan Kamar','Klik baris untuk memperbarui status pembayaran dalam prototipe.')}<div class="table-wrap"><table><thead><tr><th>Kamar</th><th>Penghuni</th><th>Jumlah</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${bill.map(r=>`<tr><td><strong>${r.id}</strong></td><td>${esc(r.tenant)}</td><td>${currency(r.rent)}</td><td>${badge(r.status)}</td><td>${r.status==='due'?`<button class="btn soft xs" onclick="app.pay('${r.id}')">${I('check',12)} Tandai lunas</button>`:`<button class="btn xs" onclick="app.room('${r.id}')">Detail ${I('chevron',12)}</button>`}</td></tr>`).join('')}</tbody></table></div></div>`}
function partnerCards(compactView=false){return `<div class="partner-grid">${state.partners.map(p=>{const relevant=orderGroup().filter(o=>o.partner===p.id);return `<div class="partner-card" onclick="app.partner('${p.id}')"><div class="partner-head"><div class="small-icon">${I(p.icon,21)}</div><div><div class="partner-title">${esc(p.name)}</div><div class="subtle mt10" style="margin-top:4px">${esc(p.cat)}</div></div></div><div class="partner-foot"><div><span>Produk / jasa</span><strong>${p.products.length} aktif</strong></div><div><span>Pesanan</span><strong>${relevant.length}</strong></div><span class="badge ${p.active?'green':'gray'}">${p.active?'Mitra aktif':'Nonaktif'}</span></div></div>`}).join('')}</div>`}
function partnersPage(){return `${pageHeader('PARTNER ECOSYSTEM','Mitra & Katalog Produk','Kelola usaha lokal, stok produk, komisi, dan tanggung jawab pelayanan.',`<button class="btn" onclick="app.policy()">${I('shield',15)} Standar mitra</button>`)}<div class="grid four">${metric('store','Mitra terdaftar',state.partners.length,'Usaha lokal simulasi')}${metric('package','Total katalog',state.partners.reduce((a,p)=>a+p.products.length,0),'Produk dan jasa')}${metric('bag','Pesanan aktif',activeOrders().length,'Perlu penyelesaian')}${metric('shield','Kebijakan layanan','5 pilar','Deskripsi, PIC, SLA, resolusi, verifikasi')}</div><div class="card padded section-gap">${sectionTitle('Direktori Mitra','Klik mitra untuk melihat etalase, harga, stok, dan tanggung jawab.')}${partnerCards()}</div><div class="note section-gap">${I('info',16)} Harga dan stok berikut adalah simulasi. Saat sistem live, mitra hanya boleh mengubah katalog miliknya dan perubahan tertentu dapat memerlukan persetujuan admin.</div>`}
function settingsPage(){return `${pageHeader('SYSTEM SETTINGS','Properti & Ekspansi','Struktur teknis disiapkan untuk dua gedung aktif dan penambahan gedung pada 2027.',`<button class="btn" onclick="app.resetConfirm()">${I('reset',14)} Reset data demo</button>`)}<div class="grid two">${['A','B'].map(b=>`<div class="card padded">${sectionTitle('Gedung '+b,'Status aktif • Saling berhadapan')}<dl style="margin:0"><div class="detail-line"><dt>Jumlah kamar</dt><dd>${selectedRooms(b).length}</dd></div><div class="detail-line"><dt>Jumlah lantai</dt><dd>3 (ilustrasi)</dd></div><div class="detail-line"><dt>Kamar terisi</dt><dd>${roomsStats(selectedRooms(b)).occupied}</dd></div><div class="detail-line"><dt>Akses marketplace</dt><dd>${badge('paid')}</dd></div></dl></div>`).join('')}</div><div class="card padded section-gap">${sectionTitle('Pengembangan Gedung C','Perencanaan 2027, belum dihitung pada okupansi maupun laporan.')}${roadmap()}<div class="note mt20">Tidak ada gedung atau kamar baru yang dibuat melalui simulasi ini. Nanti, data lokasi dan jumlah lantai/kamar asli akan digunakan untuk konfigurasi produksi.</div></div><div class="card padded section-gap">${sectionTitle('Hak Akses','Setiap peran melihat data sesuai tanggung jawabnya.')}<div class="grid four">${[['Owner','Keuangan & seluruh gedung'],['Admin','Operasional dan tiket'],['Mitra','Pesanan dan katalog sendiri'],['Penghuni','Kamar dan pesanan sendiri']].map(([a,b])=>`<div class="tile"><div class="small-icon">${I('user',17)}</div><div><div class="tile-title">${a}</div><div class="tile-sub">${b}</div></div></div>`).join('')}</div></div>`}
function render(){const view={overview,rooms:roomsPage,residents:residentsPage,market:marketPage,tickets:ticketPage,finance:financePage,partners:partnersPage,settings:settingsPage}[ui.page]||overview;const mobile=[['overview','grid','Beranda'],['rooms','door','Kamar'],['market','bag','Market'],['tickets','shield','Tiket'],['finance','wallet','Keuangan']];document.getElementById('root').innerHTML=`<div class="app">${sidebar()}<div class="main">${topbar()}<main class="content">${view()}</main></div></div><nav class="mobile-nav">${mobile.map(([id,ico,name])=>`<button onclick="app.go('${id}')" class="${ui.page===id?'active':''}">${I(ico,19)}${name}</button>`).join('')}</nav>`;if(ui.bell)renderBell();else {let el=document.getElementById('bellpop');if(el)el.remove()} }
function modalShell(title,sub,body,footer='',type='drawer'){document.getElementById('layer').innerHTML=`<div class="modal-layer ${type==='dialog'?'center':''}" onclick="if(event.target===this)app.close()"><section role="dialog" aria-modal="true" aria-label="${esc(title)}" class="${type==='dialog'?'dialog':'drawer'}"><div class="modal-header"><div><div class="eyebrow">ARJUNA KOST</div><h2>${title}</h2>${sub?`<p>${sub}</p>`:''}</div><button class="close" aria-label="Tutup" onclick="app.close()">${I('close',17)}</button></div>${body}${footer}</section></div>`;document.body.classList.add('no-scroll')}
const line=(k,v)=>`<div class="detail-line"><dt>${k}</dt><dd>${v}</dd></div>`;
function roomModal(id){const r=state.rooms.find(x=>x.id===id);if(!r)return;const tickets=state.tickets.filter(t=>t.room===id);const orders=state.orders.filter(o=>o.room===id);modalShell(`Kamar ${r.id}`,`Gedung ${r.building} · Lantai ${r.floor}`,`<div class="row-split"><div class="small-icon">${I('door',20)}</div>${badge(r.status)}</div><dl>${line('Penghuni',esc(r.tenant||'Belum ditempati'))}${line('Harga sewa',currency(r.rent)+'/bulan')}${line('Status pembayaran',badge(r.status))}${line('Masa kontrak',r.tenant?'Sampai 31 Mar 2027 (contoh)':'—')}${line('Tiket aktif',tickets.filter(t=>t.status!=='done').length)}${line('Pesanan marketplace',orders.length)}</dl>${r.status==='due'?`<button class="btn primary w100 mt14" onclick="app.pay('${r.id}');app.room('${r.id}')">${I('check',15)} Tandai tagihan lunas (demo)</button>`:''}${r.tenant?`<div class="subsection"><h3 class="subheader">Tiket terkait kamar</h3><div class="list">${tickets.map(ticketRow).join('')||'<span class="muted small">Tidak ada tiket pada kamar ini.</span>'}</div></div>`:''}<div class="actions-row"><button class="btn primary" onclick="app.newTicket('${r.id}')">${I('add',15)} Lapor kerusakan</button><button class="btn" onclick="app.close();app.go('finance')">${I('wallet',15)} Lihat tagihan</button></div>`)}
function ticketModal(id){let t=state.tickets.find(t=>t.id===id);if(!t)return;const states=['open','progress','done'],idx=states.indexOf(t.status);modalShell(`Tiket ${t.id}`,`${t.room} · ${t.category}`,`<div class="row-split"><div>${badge(t.priority)}</div>${badge(t.status)}</div><h3 style="font-size:18px;margin:20px 0 8px;letter-spacing:-.02em">${esc(t.issue)}</h3><p class="help">${esc(t.note)}</p><dl>${line('Kamar',esc(t.room))}${line('Penanggung jawab',esc(t.owner))}${line('Target respons',esc(t.sla))}${line('Dibuat',esc(t.time))}${line('Status terkini',badge(t.status))}</dl><div class="subsection"><h3 class="subheader">Jejak penanganan</h3><div class="timeline">${[['Laporan diterima','Tiket dan lokasi telah tercatat'],['Petugas menangani','Penanggung jawab telah ditunjuk'],['Selesai & diverifikasi','Hasil penanganan telah dicatat']].map(([title,sub],i)=>`<div class="timeline-step"><div class="timeline-marker ${i<=idx?'active':''}">${i<idx?I('check',12):i+1}</div><div class="timeline-body"><strong>${title}</strong><small>${sub}</small></div></div>`).join('')}</div></div>${t.priority==='critical'?`<div class="note red mt14"><strong>Peringatan keselamatan:</strong> gangguan listrik berbahaya memerlukan petugas kompeten dan respons langsung. Jangan hanya mengandalkan tiket digital.</div>`:''}<div class="actions-row">${t.status==='open'?`<button class="btn primary" onclick="app.ticketStatus('${t.id}','progress')">${I('wrench',15)} Mulai penanganan</button>`:''}${t.status==='progress'?`<button class="btn primary" onclick="app.ticketStatus('${t.id}','done')">${I('check',15)} Verifikasi selesai (demo)</button>`:''}${t.status==='done'?`<button class="btn soft" onclick="app.ticketStatus('${t.id}','open')">${I('reset',15)} Buka kembali</button>`:''}</div><p class="help mt14">Setiap perubahan pada prototipe ini hanya disimpan di browser lokal. Sistem produksi memerlukan audit log, bukti pekerjaan, dan persetujuan sesuai kewenangan.</p>`)}
function orderModal(id){let o=state.orders.find(o=>o.id===id),p=state.partners.find(p=>p.id===o.partner);if(!o)return;let orderSteps=['new','process','done'];let idx=orderSteps.indexOf(o.status);modalShell(`Pesanan ${o.id}`,`${p?.name||'Mitra'} · ${o.room}`,`<div class="row-split"><span class="small-icon">${I(p?.icon||'bag',20)}</span>${badge(o.status)}</div><h3 style="font-size:19px;margin:23px 0 4px">${esc(o.service)}</h3><p class="muted small">Layanan oleh ${esc(p?.name||'-')}</p><dl>${line('Kamar tujuan',esc(o.room))}${line('Pelaksana',esc(p?.name||'Mitra'))}${line('Nilai transaksi',currency(o.amount))}${line('Komisi ilustratif',currency(Math.round(o.amount*(p?.fee||0)/100)))}${line('Dibuat',esc(o.time))}${line('Status pesanan',badge(o.status))}</dl><h3 class="subheader mt20">Tahapan layanan</h3><div class="service-timeline">${[0,1,2].map(i=>`<span class="${i<=idx?'done':''}"></span>`).join('')}</div><div class="row-split mt10"><span class="subtle">Diterima mitra</span><span class="subtle">Diproses</span><span class="subtle">Diterima penghuni</span></div><div class="note mt20"><strong>Tanggung jawab:</strong> ${esc(p?.name||'Mitra')} menangani pemenuhan pesanan. Admin ARJUNA menjadi pusat pengaduan dan pengawasan penyelesaian.</div><div class="actions-row">${o.status==='new'?`<button class="btn primary" onclick="app.orderStatus('${o.id}','process')">${I('check',14)} Mitra menerima</button>`:''}${o.status==='process'?`<button class="btn primary" onclick="app.orderStatus('${o.id}','done')">${I('check',14)} Tandai selesai</button>`:''}${o.status==='done'?`<button class="btn soft" onclick="app.orderStatus('${o.id}','process')">${I('reset',14)} Buka ulang status</button>`:''}${!['done','cancel'].includes(o.status)?`<button class="btn danger" onclick="app.orderStatus('${o.id}','cancel')">Batalkan</button>`:''}${o.status==='cancel'?`<button class="btn soft" onclick="app.orderStatus('${o.id}','new')">Pulihkan pesanan</button>`:''}</div>`)}
function partnerModal(id){const p=state.partners.find(p=>p.id===id);if(!p)return;const orders=state.orders.filter(o=>o.partner===id);modalShell(esc(p.name),esc(p.cat),`<div class="row-split"><div class="small-icon">${I(p.icon,20)}</div><span class="badge ${p.active?'green':'gray'}">${p.active?'Mitra aktif':'Nonaktif'}</span></div><dl>${line('Kategori',esc(p.cat))}${line('Jumlah katalog',p.products.length+' item')}${line('Komisi (simulasi)',p.fee+'%')}${line('Order contoh',orders.length)}</dl><h3 class="subheader mt20">Katalog produk & jasa</h3><div class="list">${p.products.map((x,i)=>`<div class="list-row"><div class="row-main"><div class="row-title">${esc(x.name)}</div><div class="row-sub">${currency(x.price)} · Stok/kapasitas: ${x.stock}</div></div><button class="btn xs" onclick="app.stock('${p.id}',${i},-1)">${I('close',12)} -1</button><button class="btn xs" onclick="app.stock('${p.id}',${i},1)">${I('add',12)} +1</button></div>`).join('')}</div><div class="note mt20">Kontrol stok ini untuk demonstrasi dashboard admin. Pada versi live, mitra mengelola katalognya sendiri dengan aturan verifikasi.</div><div class="actions-row"><button class="btn ${p.active?'warning':'primary'}" onclick="app.partnerToggle('${p.id}')">${p.active?'Nonaktifkan sementara':'Aktifkan mitra'}</button></div>`)}
function createTicket(prefill=''){const opts=buildingRooms().filter(r=>r.status!=='vacant');modalShell('Buat Tiket Baru','Catat masalah dan penanggung jawabnya.',`<form id="ticketForm" onsubmit="app.submitTicket(event)"><div class="field"><label class="input-label" for="t-room">Kamar</label><select class="input" id="t-room" name="room" required>${opts.map(r=>`<option ${r.id===prefill?'selected':''} value="${r.id}">${r.id} — ${esc(r.tenant)}</option>`).join('')}</select></div><div class="field"><label class="input-label" for="t-type">Jenis masalah</label><select class="input" id="t-type" name="category"><option>Fasilitas Kamar</option><option>Air & Sanitasi</option><option>Internet</option><option>Listrik & Keamanan</option><option>Kebersihan</option><option>Marketplace / Mitra</option></select></div><div class="field"><label class="input-label" for="t-issue">Deskripsi masalah</label><textarea id="t-issue" class="input" rows="3" required maxlength="260" placeholder="Contoh: lampu kamar mati sejak pagi..."></textarea></div><div class="field"><label class="input-label" for="t-priority">Prioritas</label><select id="t-priority" class="input"><option value="normal">Normal</option><option value="high">Tinggi</option><option value="critical">Darurat (keselamatan)</option></select></div><div class="note amber">Laporan darurat harus disertai tindakan langsung kepada petugas. Tiket digital tidak menggantikan prosedur keselamatan.</div><div class="actions-row"><button type="submit" class="btn primary w100">${I('check',16)} Buat tiket simulasi</button></div></form>`,'','dialog')}
function newOrderModal(){let eligible=buildingRooms().filter(r=>r.status!=='vacant');modalShell('Simulasi Pesanan','Tambah order mitra untuk mencoba alur operasional.',`<form id="orderForm" onsubmit="app.submitOrder(event)"><div class="field"><label class="input-label" for="o-room">Kamar tujuan</label><select class="input" id="o-room">${eligible.map(r=>`<option value="${r.id}">${r.id} — ${esc(r.tenant)}</option>`).join('')}</select></div><div class="field"><label class="input-label" for="o-partner">Mitra toko</label><select class="input" id="o-partner" onchange="app.orderProductOptions()">${state.partners.filter(p=>p.active).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label class="input-label" for="o-product">Produk / jasa</label><select class="input" id="o-product"></select></div><div class="note">Pesanan ini adalah data demonstrasi dan tidak terkirim kepada mitra sungguhan.</div><button type="submit" class="btn primary wide mt20">${I('add',16)} Buat pesanan</button></form>`,'','dialog');app.orderProductOptions()}
function searchModal(q=''){modalShell('Pencarian Cepat','Temukan kamar, tiket, pesanan, dan mitra dalam satu tempat.',`<div class="field"><input class="input" id="qsearch" autofocus oninput="app.searchResults(this.value)" placeholder="Contoh: A-101, laundry, bocor..."></div><div id="search-list"></div>`,'','dialog');document.getElementById('qsearch').value=q;app.searchResults(q);setTimeout(()=>document.getElementById('qsearch')?.focus(),20)}
function renderBell(){let elem=document.createElement('div');elem.id='bellpop';elem.className='bell-panel';elem.innerHTML=`<div class="row-split mb10"><strong>Notifikasi Operasional</strong><button class="close" onclick="app.bell()">${I('close',15)}</button></div><div class="list"><div class="list-row"><div class="small-icon red">${I('alert',18)}</div><div class="row-main"><div class="row-title">${activeTickets().filter(t=>t.priority==='critical').length} tiket keselamatan aktif</div><div class="row-sub">Perlu pemeriksaan pengelola</div></div></div><div class="list-row"><div class="small-icon amber">${I('clock',18)}</div><div class="row-main"><div class="row-title">${buildingRooms().filter(r=>r.status==='due').length} tagihan menunggu</div><div class="row-sub">Penagihan Oktober (demo)</div></div></div><div class="list-row"><div class="small-icon">${I('bag',18)}</div><div class="row-main"><div class="row-title">${activeOrders().length} order belum selesai</div><div class="row-sub">Pesanan toko & jasa</div></div></div></div>`;document.body.appendChild(elem)}
function resetDialog(){modalShell('Reset Data Simulasi','Kembalikan dashboard seperti kondisi contoh semula.',`<div class="note amber">Semua perubahan kamar, tiket, pesanan, dan stok yang dibuat melalui prototipe ini akan dihapus dari browser ini.</div><div class="actions-row"><button class="btn danger" onclick="app.doReset()">${I('reset',15)} Ya, reset data demo</button><button class="btn" onclick="app.close()">Batal</button></div>`,'','dialog')}
function policyDialog(){modalShell('Standar Mitra ARJUNA','Service Assurance berlaku juga untuk produk toko.',`<div class="list">${[['Deskripsi yang jujur','Harga, foto, stok, waktu, dan informasi produk harus akurat.'],['Penanggung jawab','Mitra memenuhi pesanan, admin mengawasi keluhan.'],['Target pelayanan','Jam operasional, batas konfirmasi, dan jadwal disepakati.'],['Resolusi masalah','Produk salah/rusak/habis ditangani melalui pilihan penggantian atau refund sesuai kesepakatan.'],['Verifikasi kualitas','Penghuni dapat melapor, admin menilai bukti, keputusan terekam.']].map(([a,b],i)=>`<div class="list-row"><div class="small-icon">${i+1}</div><div class="row-main"><div class="row-title">${a}</div><div class="row-sub" style="white-space:normal;line-height:1.5">${b}</div></div></div>`).join('')}</div><div class="note mt20">Ketentuan final harus dituangkan dalam kontrak mitra, termasuk aturan klaim, kompensasi, pembayaran, dan privasi data.</div>`,'','dialog')}
function toast(msg){let t=document.createElement('div');t.className='toast';t.innerHTML=`${I('check',18)}<span>${esc(msg)}</span>`;document.getElementById('toasts').appendChild(t);setTimeout(()=>t.remove(),3300)}
const app={
 go(p){ui.page=p;ui.navOpen=false;ui.bell=false;render();window.scrollTo({top:0,behavior:'smooth'})},
 building(b){ui.building=b;ui.bell=false;render()},
 nav(){ui.navOpen=!ui.navOpen;render()},
 bell(){ui.bell=!ui.bell;render()},
 roomFilter(x){ui.roomFilter=x;render()},orderFilter(x){ui.orderFilter=x;render()},ticketFilter(x){ui.ticketFilter=x;render()},
 room:roomModal,ticket:ticketModal,order:orderModal,partner:partnerModal,newTicket:createTicket,newOrder:newOrderModal,search:searchModal,resetConfirm:resetDialog,policy:policyDialog,
 close(){document.getElementById('layer').innerHTML='';document.body.classList.remove('no-scroll')},
 pay(id){let r=state.rooms.find(r=>r.id===id);if(!r||r.status==='vacant')return;r.status='paid';save();render();toast('Tagihan kamar '+id+' ditandai lunas (demo).')},
 ticketStatus(id,status){let t=state.tickets.find(t=>t.id===id);if(!t)return;t.status=status;save();render();ticketModal(id);toast('Status tiket '+id+' diperbarui.')},
 orderStatus(id,status){let o=state.orders.find(o=>o.id===id);if(!o)return;o.status=status;save();render();orderModal(id);toast('Status pesanan '+id+' diperbarui.')},
 stock(pid,idx,d){let p=state.partners.find(p=>p.id===pid);if(!p)return;p.products[idx].stock=Math.max(0,p.products[idx].stock+d);save();partnerModal(pid);toast('Stok '+p.products[idx].name+' diperbarui (demo).')},
 partnerToggle(id){let p=state.partners.find(p=>p.id===id);p.active=!p.active;save();render();partnerModal(id);toast('Status mitra berhasil diperbarui (demo).')},
 submitTicket(e){e.preventDefault();let id='TKT-'+String(25+Math.max(0,state.tickets.length-5)).padStart(3,'0');let pri=document.getElementById('t-priority').value;let cat=document.getElementById('t-type').value;let obj={id,room:document.getElementById('t-room').value,category:cat,issue:document.getElementById('t-issue').value.trim(),priority:pri,status:'open',owner:pri==='critical'?'Pengelola + Teknisi':'Admin Operasional',sla:pri==='critical'?'Segera':pri==='high'?'4 jam':'24 jam',time:'Baru saja',note:'Laporan baru dari simulasi dashboard.'};if(!obj.issue)return;state.tickets.unshift(obj);save();app.close();ui.page='tickets';render();ticketModal(id);toast('Tiket '+id+' dibuat dalam mode demo.')},
 orderProductOptions(){let el=document.getElementById('o-partner');let productEl=document.getElementById('o-product');if(!el||!productEl)return;let p=state.partners.find(p=>p.id===el.value);productEl.innerHTML=p.products.map((s,i)=>`<option value="${i}" ${s.stock===0?'disabled':''}>${esc(s.name)} — ${currency(s.price)}${s.stock===0?' (habis)':''}</option>`).join('')},
 submitOrder(e){e.preventDefault();let p=state.partners.find(p=>p.id===document.getElementById('o-partner').value),idx=Number(document.getElementById('o-product').value),pr=p?.products[idx];if(!pr||pr.stock<=0){toast('Produk sedang tidak tersedia.');return}let id='ORD-'+(1060+state.orders.length);let room=document.getElementById('o-room').value;state.orders.unshift({id,room,partner:p.id,service:pr.name,amount:pr.price,status:'new',time:'Baru saja'});pr.stock--;save();app.close();ui.page='market';render();orderModal(id);toast('Pesanan '+id+' dibuat dalam mode demo.')},
 searchResults(q){const el=document.getElementById('search-list');if(!el)return;q=q.trim().toLocaleLowerCase();if(!q){el.innerHTML='<div class="note">Cari berdasarkan nomor kamar, nama penghuni, tiket, layanan, atau mitra.</div>';return}const hits=[...state.rooms.filter(r=>r.id.toLowerCase().includes(q)||(r.tenant||'').toLowerCase().includes(q)).slice(0,7).map(r=>({name:r.id+' · '+(r.tenant||'Kamar kosong'),sub:'Kamar Gedung '+r.building,cb:`app.room('${r.id}')`})),...state.tickets.filter(t=>t.id.toLowerCase().includes(q)||t.issue.toLowerCase().includes(q)).slice(0,5).map(t=>({name:t.id+' · '+t.issue,sub:'Tiket '+t.room,cb:`app.ticket('${t.id}')`})),...state.orders.filter(o=>o.id.toLowerCase().includes(q)||o.service.toLowerCase().includes(q)).slice(0,5).map(o=>({name:o.id+' · '+o.service,sub:'Pesanan '+o.room,cb:`app.order('${o.id}')`})),...state.partners.filter(p=>p.name.toLowerCase().includes(q)).slice(0,5).map(p=>({name:p.name,sub:'Mitra toko',cb:`app.partner('${p.id}')`}))].slice(0,12);el.innerHTML=hits.map(h=>`<div class="search-result" onclick="${h.cb}"><div class="small-icon">${I('search',16)}</div><div class="row-main"><div class="row-title">${esc(h.name)}</div><div class="row-sub">${esc(h.sub)}</div></div>${I('chevron',16)}</div>`).join('')||empty('Tidak ditemukan','Coba kata kunci atau nomor kamar lainnya.')},
 export(){let rs=buildingRooms(),s=roomsStats(rs);let rows=[['Laporan ARJUNA KOST — Data Simulasi'],['Gedung',ui.building==='all'?'Semua':ui.building],['Total Kamar',s.total],['Terisi',s.occupied],['Kosong',s.vacant],['Tagihan',s.billed],['Terbayar',s.collected],['Piutang',s.billed-s.collected],[],['Kamar','Penghuni','Gedung','Sewa','Status'],...rs.map(r=>[r.id,r.tenant||'',r.building,r.rent,r.status])];let csv='\uFEFF'+rows.map(a=>a.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='ARJUNA-KOST-laporan-demo.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Laporan CSV simulasi telah dibuat.')},
 doReset(){state=seedData();save();ui.building='all';ui.page='overview';app.close();render();toast('Seluruh data demo dikembalikan ke kondisi awal.')}
};
window.app=app;render();document.addEventListener('keydown',e=>{if(e.key==='Escape'){app.close();ui.bell=false;render()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();app.search()}});
</script>
</body>
</html>
